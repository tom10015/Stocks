name: Update SEC share counts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update.py
      - tickers.json
      - .github/workflows/update.yml
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: sec-share-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check fallback data source availability
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
            'https://r.jina.ai/https://data.sec.gov/api/xbrl/companyconcept/CIK0000320193/dei/EntityCommonStockSharesOutstanding.json',
            'https://r.jina.ai/https://stockanalysis.com/stocks/aapl/statistics/',
            'https://api.nasdaq.com/api/quote/AAPL/summary?assetclass=stocks'
          ]
          for url in urls:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12)
                  b=r.read(1500).decode('utf8','replace')
                  print('SOURCE',url.split('/')[2],r.status,'SAMPLE',repr(b[:130]))
              except Exception as ex:
                  print('SOURCE FAILED',url.split('/')[2],repr(ex))
          PY
      - name: Collect SEC share counts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'ShareWatch tom10015@users.noreply.github.com' }}
        run: python update.py
      - name: Commit refreshed share counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shares.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEC share count data"
            git push
          fi
