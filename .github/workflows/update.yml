name: Update SEC share counts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update.py
      - tickers.json
      - .github/workflows/update.yml
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: sec-share-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect SEC share counts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'ShareWatch tom10015@users.noreply.github.com' }}
        run: python update.py
      - name: Commit refreshed share counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shares.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEC share count data"
            git push
          fi
