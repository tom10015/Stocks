name: Collect advanced stock-chart bars
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ohlcv_update.py
      - .github/workflows/ohlcv.yml
  schedule:
    # Four scheduled passes daily; all active tickers are checked in each pass.
    - cron: "17 3,9,15,21 * * *"
permissions:
  contents: write
concurrency:
  group: sharewatch-ohlcv_update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python importer
        run: python -m py_compile ohlcv_update.py
      - name: Collect OHLCV for all active watchlist symbols
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'ShareWatch tom10015@users.noreply.github.com' }}
        run: python -u ohlcv_update.py --max-tickers 120 --refresh-hours 5.5
      - name: Commit source-attributed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data/ohlcv.json"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
