name: Refresh earnings and dividend calendar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_market_calendar.py
      - .github/workflows/market-calendar.yml
  schedule:
    - cron: "33 10 * * *"
permissions:
  contents: write
concurrency:
  group: sharewatch-events
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate market-calendar collector
        run: python -m py_compile update_market_calendar.py
      - name: Retrieve source-reported earnings and dividend events
        run: python update_market_calendar.py
      - name: Commit updated event calendar
        run: |
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source-reported market event calendar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
