name: Backfill missing share-count history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_backfill.py
      - .github/workflows/backfill.yml
  schedule:
    - cron: "43 4 * * 0"
permissions:
  contents: write
concurrency:
  group: sec-share-update
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify backfill script
        run: python -m py_compile historical_backfill.py merge_data.py
      - name: Retrieve historic filing shares for missing-data symbols
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'ShareWatch tom10015@users.noreply.github.com' }}
        run: python -u historical_backfill.py --max-filing-per-fund 7 --max-tickers 40
      - name: Merge onto latest repository history
        run: |
          cp data/shares.json /tmp/sharewatch-backfill-incoming.json
          cp data/backfill_status.json /tmp/sharewatch-backfill-status.json
          git fetch origin main
          git reset --hard origin/main
          python merge_data.py /tmp/sharewatch-backfill-incoming.json data/shares.json
          cp /tmp/sharewatch-backfill-status.json data/backfill_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shares.json data/backfill_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill verified historical share counts"
            git push origin HEAD:main
          fi
