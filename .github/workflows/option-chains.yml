name: Refresh ShareWatch automatic option chains
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - options_chain_update.py
      - tests/test_option_chains.py
      - .github/workflows/option-chains.yml
  schedule:
    - cron: "44 0,6,12,18 * * *"
permissions:
  contents: write
concurrency:
  group: sharewatch-option-quote-update
  cancel-in-progress: false
jobs:
  option_chains:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate option chain scraper
        run: |
          python -m py_compile options_chain_update.py
          python -m unittest discover -s tests -p 'test_option_chains.py'
      - name: Download delayed real option quotes
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
        run: python -u options_chain_update.py --limit 100
      - name: Commit market quotes
        run: |
          cp data/options_chains.json /tmp/sharewatch-options-chains-incoming.json
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          target=Path("data/options_chains.json")
          old=json.loads(target.read_text()) if target.exists() else {"chains":{}}
          new=json.loads(Path("/tmp/sharewatch-options-chains-incoming.json").read_text())
          old.setdefault("chains",{}).update(new.get("chains",{}))
          old["generated_at"]=new.get("generated_at")
          target.write_text(json.dumps(old,separators=(",",":"))+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/options_chains.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh delayed real option quotes for ShareWatch"
            git push origin HEAD:main
          fi
